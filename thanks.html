<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f0">
  <meta name="robots" content="noindex">
  <title>Inquiry received | Tepu Solutions</title>
  <style>
    :root{color-scheme:light;--ink:#24170c;--muted:#735b41;--accent:#a95b19;--paper:#faf7f0}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.65 Inter,"Segoe UI",Arial,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,6vw,56px);border:1px solid #e6d8c5;border-radius:12px;background:#fffdf9;box-shadow:0 18px 48px #24170c12}
    img{display:block;width:min(220px,65%);height:auto;margin-bottom:38px}
    .eyebrow{margin:0 0 10px;color:var(--accent);font:700 12px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
    h1{max-width:14ch;margin:0 0 14px;font:600 clamp(32px,6vw,44px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.025em}
    p{margin:0;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 17px;border:1px solid #dfcdb7;border-radius:7px;color:var(--ink);font-weight:650;text-decoration:none}
    a.primary{border-color:var(--accent);background:var(--accent);color:white}
    a:focus-visible{outline:3px solid #d69a5a;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <a href="https://tepusolutions.com/" aria-label="Tepu Solutions home"><img src="https://tepusolutions.com/assets/tepu-company-logo.svg" alt="Tepu Solutions Limited"></a>
    <p class="eyebrow">Inquiry received</p>
    <h1>Thank you for contacting Tepu Solutions.</h1>
    <p>Your inquiry has been sent to our team. We’ll review the details and follow up within 24 hours.</p>
    <div class="actions"><a class="primary" href="https://tepusolutions.com/">Return to the website</a><a href="mailto:partnership@tepusolutions.com">Email us directly</a></div>
  </main>
</body>
</html>
